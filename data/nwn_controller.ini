; Neverwinter Nights: Enhanced Edition - controller support
; Lives next to nwmain.exe (bin\win32). Changes apply the next time the game starts.
;
; MODES
;   Controller mode (the default, see [play]) is the controller-first layer: direct
;   analog movement, automatic targeting, stick-steered radial menus, the on-screen
;   prompts, the conversation picker and d-pad navigation in menus. Hold L3+R3 for
;   a second (or press Ctrl+Shift+F11) to switch to classic mode and back.
;   Classic mode only turns the pad into the game's keys and mouse, exactly as bound
;   below. Controller mode uses the same bindings, but takes over the left stick,
;   d-pad left/right (targets) and A/X (act on the target) while you're in the world.
;
; ACTIONS
;   key:<name>            a key, using SDL key names: W, Space, Escape, Tab, F1,
;                         Left, Right, Up, Down, PageUp, PageDown, Keypad 0,
;                         Left Shift, Left Ctrl, Left Alt, Return, ...
;   key:<a>+<b>           keys held together, e.g. key:Left Shift+F1
;   mouse:left|right|middle|x1|x2
;   cursor:center         move the pointer to the middle of the screen
;   stick:toggle          switch the right stick between camera and pointer (on release)
;   none                  do nothing
;
; INPUTS
;   a b x y back guide start leftstick rightstick leftshoulder rightshoulder
;   dpup dpdown dpleft dpright lefttrigger righttrigger
;   (Xbox names; on PlayStation a=Cross b=Circle x=Square y=Triangle,
;    back=Share/Create, start=Options)
;
; LAYERS
;   [base] is active normally. Holding layer1_button selects [layer1], holding
;   layer2_button selects [layer2], holding both selects [layer1+2]. An input left
;   out of a layer falls back to [base]. Layer buttons do nothing by themselves
;   (in a menu, tapping one on its own switches tabs).
;
; The defaults match NWN's stock key bindings. If you've remapped keys in the
; game's Keymapping screen, update the key: names here to match.

[general]
enabled = 1
layer1_button = leftshoulder
layer2_button = rightshoulder
; How far a trigger must be pulled to count as pressed (0-1).
trigger_threshold = 0.30

[play]
; controller = start in controller mode once a game is loaded; classic = start in
; classic mode. Either way, hold L3+R3 to switch.
mode = controller
; Movement in controller mode:
; facing = turn the character to the stick direction and run (needs the known game build)
; steer  = run forward and steer with the turn keys (works on any build)
drive_mode = facing
; 1 = keep the direction "up" had when you started moving, even if the camera swings
lock_frame = 0
; Push a movement update to the server when the heading turns this many degrees.
force_send_degrees = 12
; Stick deflection below this walks (holds Shift); 0 = always run.
walk_threshold = 0.6
steer_tolerance = 8
; 1 = stop dead when you let go of the stick (single player / local host only).
; 0 = let the game finish the current step, which carries you ~0.4 s further.
stop_on_release = 1
; Targeting (right stick in camera mode). The game highlights and names the target
; itself; A does what a left click on it would (attack / talk / open / pick up), X
; opens its radial menu. With no target, A and X do nothing. The target is picked
; from where you aim: the left stick while you move, otherwise where the camera
; looks. Hostiles come first; your companions are never picked. D-pad left/right
; steps to the next target left or right of the current one and locks it until it's
; out of reach. Moving the real mouse pauses targeting until you use the pad again.
targeting = 1
; Degrees either side of the aim for the automatic target.
target_cone = 60
; Metres: doors, containers, items and people to talk to / hostile creatures.
target_interact_range = 10
target_hostile_range = 25
; 1 = hide the mouse pointer while nothing is targeted and during conversations
; (camera mode). It comes back for a target, in pointer mode and when the mouse moves.
hide_idle_pointer = 1

[sticks]
; Movement in classic mode: the stick holds these keys (8-way). Defaults: W run
; forward, S back, A/D turn. Use key:Q / key:E for move_left/move_right to strafe.
move_stick = left
move_deadzone = 0.35
move_up = key:W
move_down = key:S
move_left = key:A
move_right = key:D

; Mouse pointer.
cursor_stick = right
cursor_deadzone = 0.15
; Pixels per second at full tilt, scaled to window height (1080p reference).
cursor_speed = 1300
; Response curve: 1 = linear, higher = finer control near the center.
cursor_curve = 2.0

; Right stick mode at startup: camera (rotate the view) or pointer (move the mouse).
; Clicking the right stick (stick:toggle below) switches between them. With no game
; camera (main menu, character creation) the stick always moves the pointer.
cursor_stick_mode = camera
; Degrees per second at full tilt.
camera_yaw_speed = 150
camera_pitch_speed = 60
; 1 = reverse that axis.
camera_invert_x = 0
camera_invert_y = 0

[base]
a = mouse:left              ; select / move / attack / talk
x = mouse:right             ; radial (context) menu
b = key:Escape              ; close window / cancel / game menu
y = key:Keypad 0            ; radial menu on yourself
start = key:Space           ; pause
back = key:M                ; map
guide = none
leftstick = key:Tab         ; inspect / highlight objects
rightstick = stick:toggle     ; right stick: camera <-> pointer
dpleft = key:Left           ; rotate camera left
dpright = key:Right         ; rotate camera right
dpup = key:PageUp           ; tilt camera up
dpdown = key:PageDown       ; tilt camera down
lefttrigger = key:Down      ; zoom out
righttrigger = key:Up       ; zoom in

[layer1]
; Hold LB: quickbar slots F1-F8.
dpleft = key:F1
dpup = key:F2
dpright = key:F3
dpdown = key:F4
x = key:F5
y = key:F6
b = key:F7
a = key:F8

[layer2]
; Hold RB: quickbar slots F9-F12 and game panels.
dpleft = key:F9
dpup = key:F10
dpright = key:F11
dpdown = key:F12
x = key:B                   ; spellbook
y = key:I                   ; inventory
b = key:C                   ; character sheet
a = key:J                   ; journal
back = key:R                ; rest
start = key:O               ; options

[layer1+2]
; Hold LB+RB: the Shift quickbar, same layout as layer1.
dpleft = key:Left Shift+F1
dpup = key:Left Shift+F2
dpright = key:Left Shift+F3
dpdown = key:Left Shift+F4
x = key:Left Shift+F5
y = key:Left Shift+F6
b = key:Left Shift+F7
a = key:Left Shift+F8

[overlay]
; The controller UI drawn over the game: button prompts, the reply picker and so on.
enabled = 1
; Size on top of following the window height (1 = sized for 1080p).
scale = 1.0
; 1 = while the reply picker shows a conversation (controller mode), move the game's
; own conversation window out of sight. 0 = keep both.
hide_stock_dialog = 1

[diag]
; Maintenance tools; see docs/MAINTAINING.md.
; 1 = tap L3+R3 together (or Ctrl+Shift+F10) to write a snapshot of the camera,
; nearby objects, open menus and their controls to nwn_controller.log.
enabled = 1
; 1 = log where the character is every 50 ms for 1.2 s after each stop (debugging).
trace_stops = 0
; 1 = play nwn_controller_inject.txt (next to this file) as a virtual pad whenever
; it changes: a testing aid, see src/inject.h for the script format.
inject = 0
